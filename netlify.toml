# Dedicated SE Education branch: publish only the education website.
# This configuration applies to SE-Education, not SELC's main branch.
[build]
  publish = "se-education/public"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
