name: SELC public and integration smoke checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate SELC frontend and gateway syntax
        run: |
          node --check app.js
          node --check netlify/functions/portal-gateway.mjs
          node --check qa/smoke.mjs
          node --check qa/live-auth-release-gate.mjs
      - name: Validate public routes, Community Leaders and sign-in paths
        run: node qa/smoke.mjs
