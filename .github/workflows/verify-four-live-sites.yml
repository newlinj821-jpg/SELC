name: Verify SE public websites and member operations
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-four-live-sites.yml
      - qa/live-simplification-check.mjs
  workflow_dispatch:
jobs:
  live-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirm Portal, Hub and SELC production deployment
        run: node qa/live-simplification-check.mjs
