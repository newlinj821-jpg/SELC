name: SELC and Portal Staff connection production verification (read-only)
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify new Founder/Director, Staff connection and handbook release
        run: |
          set -e
          for attempt in $(seq 1 12); do
            if node --input-type=module -e '
              import assert from "node:assert/strict";
              async function get(url){
                const response=await fetch(url,{redirect:"follow",cache:"no-store",signal:AbortSignal.timeout(12000)});
                assert.ok(response.ok,url+" returned HTTP "+response.status);
                return {url:response.url,body:await response.text()};
              }
              const root="https://se-selc.netlify.app";
              const home=await get(root+"/");
              assert.equal(new URL(home.url).hostname,"se-selc.netlify.app");
              assert.match(home.body,/FOUNDER \/ DIRECTOR/,"SELC must publish the Founder\/Director title");
              assert.match(home.body,/Advisor or Representative position/,"SELC should describe both application paths");
              for(const route of ["/purpose/","/community-leaders/","/education/"])await get(root+route);
              const app=await get(root+"/app.js");
              assert.match(app.body,/async function staffConnectionPage\(\)/,"Staff SELC screen must be live");
              assert.match(app.body,/Founder\/Director/,"SELC account title must be updated");
              const staff=await get("https://sanctumportal.org/assets/se-staff.js");
              assert.match(staff.body,/query:\{role:\x27staff\x27\}/,"Portal must serve the Staff-specific handbook");
              assert.match(staff.body,/Open SELC Staff Space/,"Portal Staff must have a direct SELC connection");
              console.log("SELC and Portal Staff release content verified.");
            '; then
              exit 0
            fi
            echo "Both production builds not yet visible (attempt $attempt)."
            sleep 10
          done
          echo "Updated SELC and Portal Staff release could not be verified on both production sites."
          exit 1
