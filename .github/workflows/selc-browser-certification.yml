name: SELC role and certification browser integration (isolated)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.58.2
      - name: Install supported browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test certification and Community Leader isolation with mocked Portal
        env:
          QA_BROWSER: ${{ matrix.browser }}
        run: node qa/browser-certification.mjs
